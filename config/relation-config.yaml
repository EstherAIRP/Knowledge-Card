# Phase 2 relation pipeline configuration.
# Repository-owned configuration only. API credentials belong in GitHub Secrets / environment variables.

schema_version: 1

candidate:
  min_taxonomy_score: 0.08
  top_k: 12

semantic:
  enabled: true
  provider: local-transformers
  model: Xenova/multilingual-e5-small
  batch_size: 16
  # Multilingual-E5 cosine values are concentrated high; normalize raw cosine into a more useful 0..1 range.
  normalization_floor: 0.70
  normalization_ceiling: 0.95
  min_score: 0.20
  openai_compatible:
    base_url: https://api.openai.com/v1
    model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY

classifier:
  enabled: true
  provider: openai-compatible
  base_url: https://api.openai.com/v1
  model: gpt-5-mini
  api_key_env: OPENAI_API_KEY
  max_candidates_per_card: 6
  timeout_ms: 45000
  retries: 2

scoring:
  taxonomy_weight: 0.40
  semantic_weight: 0.60
  llm_weight: 0.35
  # Broad enough to form an LLM candidate pool.
  min_combined_score: 0.30
  # Without an LLM judgment, publish only stronger semantic/taxonomy pairs.
  fallback_min_combined_score: 0.48

relations:
  allowed_types:
    - similar_to
    - alternative_to
    - complements
    - integrates_with
    - depends_on
    - extends
    - contrasts_with
