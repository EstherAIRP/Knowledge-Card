name: Migrate GitHub resource kinds

on:
  push:
    branches:
      - chore/classify-existing-github-cards

permissions:
  contents: write

concurrency:
  group: migrate-resource-kinds
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[resource-kind-migrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/classify-existing-github-cards
          fetch-depth: 0

      - name: Signal migration run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'started\n' > .resource-kind-migration-started
          git add .resource-kind-migration-started
          git diff --cached --quiet || git commit -m "chore: mark resource kind migration started [resource-kind-migrated]"
          git push origin HEAD:chore/classify-existing-github-cards

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply resource kind migration
        run: node scripts/migrate-resource-kinds.mjs

      - name: Validate user ownership
        shell: bash
        run: |
          set -euo pipefail
          for file in content/knowledge/2026/github-*.md; do
            npm run validate:ownership -- "$file"
          done

      - name: Validate repository
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: Check diff
        run: git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git add content/knowledge/2026/github-*.md
          git diff --cached --quiet && exit 0
          git commit -m "knowledge: classify existing GitHub cards [resource-kind-migrated]"
          git push origin HEAD:chore/classify-existing-github-cards
