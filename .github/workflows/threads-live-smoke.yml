name: Threads Live Smoke

on:
  push:
    branches:
      - dev/threads-live-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Resolve live Threads share URL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Print root Threads post text
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-source.mjs 'https://www.threads.com/share/_qgqDMSsx/' > /tmp/threads-live.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const result = JSON.parse(fs.readFileSync('/tmp/threads-live.json', 'utf8'));
          const source = result.source_document;
          const parts = Array.isArray(source?.parts) ? source.parts : [];
          const root = parts[0] || source || null;
          console.log('CANONICAL_URL=' + (result.canonical_url || ''));
          console.log('ROOT_SHORTCODE=' + (root?.shortcode || ''));
          console.log('ROOT_USERNAME=' + (root?.username || ''));
          console.log('ROOT_TEXT_BEGIN');
          console.log(typeof root?.text === 'string' ? root.text : '');
          console.log('ROOT_TEXT_END');
          NODE
