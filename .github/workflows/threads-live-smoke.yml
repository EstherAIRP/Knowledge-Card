name: Threads Live Smoke

on:
  push:
    branches:
      - dev/threads-live-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Resolve live Threads share URL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve and validate live Threads source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-source.mjs 'https://www.threads.com/share/_qgqDMSsx/' > /tmp/threads-live.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const result = JSON.parse(fs.readFileSync('/tmp/threads-live.json', 'utf8'));
          const source = result.source_document;
          const parts = Array.isArray(source?.parts) ? source.parts : [];
          const mediaCount = parts.reduce((sum, part) => sum + (Array.isArray(part?.media) ? part.media.length : 0), 0);

          const summary = {
            resolved_input_url: result.resolved_input_url,
            canonical_url: result.canonical_url,
            source_identity: result.source_identity,
            mode: result.mode,
            thread: source?.thread || null,
            extraction: source?.extraction || null,
            part_count: parts.length,
            parts: parts.map((part) => ({
              index: part.index,
              id: part.id,
              shortcode: part.shortcode,
              username: part.username,
              reply_to: part.reply_to,
              root_post: part.root_post,
              has_replies: part.has_replies,
              text_length: typeof part.text === 'string' ? part.text.length : 0,
              media_count: Array.isArray(part.media) ? part.media.length : 0
            })),
            combined_text_length: typeof source?.combined_text === 'string' ? source.combined_text.length : 0,
            media_count: mediaCount,
            source_change: result.source_change || null
          };
          console.log(JSON.stringify(summary, null, 2));

          if (!source?.thread?.complete) throw new Error('Live source did not prove thread.complete=true.');
          if (!source?.extraction?.conversation_complete) throw new Error('Live source did not prove conversation_complete=true.');
          if (source.thread.total && parts.length !== source.thread.total) {
            throw new Error(`Part count mismatch: got ${parts.length}, expected ${source.thread.total}.`);
          }
          if (!(typeof source.combined_text === 'string' && source.combined_text.trim()) && mediaCount === 0) {
            throw new Error('Live source contains neither analyzable text nor media.');
          }
          NODE
