name: Threads Live Smoke

on:
  push:
    branches:
      - dev/threads-live-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Resolve live Threads share URL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve live Threads source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-source.mjs 'https://www.threads.com/share/_qgqDMSsx/' > /tmp/threads-live.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const result = JSON.parse(fs.readFileSync('/tmp/threads-live.json', 'utf8'));
          const source = result.source_document;
          const parts = Array.isArray(source?.parts) ? source.parts : [];
          const summary = {
            resolved_input_url: result.resolved_input_url,
            canonical_url: result.canonical_url,
            source_identity: result.source_identity,
            mode: result.mode,
            thread: source?.thread || null,
            extraction: source?.extraction || null,
            part_count: parts.length,
            parts: parts.map((part) => ({
              index: part.index,
              id: part.id,
              shortcode: part.shortcode,
              username: part.username,
              reply_to: part.reply_to,
              root_post: part.root_post,
              has_replies: part.has_replies,
              text_length: typeof part.text === 'string' ? part.text.length : 0,
              media_count: Array.isArray(part.media) ? part.media.length : 0
            }))
          };
          console.log('RESOLVER SUMMARY');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Inspect browser DOM and GraphQL evidence directly
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { extractThreadsViaBrowser } from './scripts/lib/sources/threads/browser-adapter.mjs';

          const canonical = 'https://threads.com/@esther1ooo/post/DFyr62jB6Wr';
          const browser = await extractThreadsViaBrowser(canonical);
          const posts = Array.isArray(browser.posts) ? browser.posts : [];
          const summary = {
            thread_indicator: browser.thread_indicator || null,
            browser: browser.browser || null,
            post_count: posts.length,
            posts: posts.map((post) => ({
              id: post.id,
              shortcode: post.shortcode,
              username: post.username,
              reply_to: post.reply_to,
              root_post: post.root_post,
              is_reply: post.is_reply,
              has_replies: post.has_replies,
              text_length: typeof post.text === 'string' ? post.text.length : 0,
              canonical_url: post.canonical_url
            }))
          };
          console.log('BROWSER EVIDENCE SUMMARY');
          console.log(JSON.stringify(summary, null, 2));
          NODE
