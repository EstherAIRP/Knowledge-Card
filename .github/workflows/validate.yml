name: Validate Knowledge Radar

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - 'runtime/ingest/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, validate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRANSFORMERS_CACHE_DIR: .cache/transformers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: transformers-${{ runner.os }}-${{ hashFiles('config/relation-config.yaml', 'package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build embedding index
        run: npm run embeddings:build

      - name: Validate embedding index
        run: npm run embeddings:validate

      - name: Build relation index
        run: npm run relations:build

      - name: Report relation diagnostics
        run: npm run relations:report

      - name: Build concept graph
        run: npm run concepts:build

      - name: Validate concept graph
        run: npm run concepts:validate

      - name: Run unit tests
        run: npm test

      - name: Validate Knowledge Cards
        run: npm run validate

      - name: Validate relation index
        run: npm run relations:validate

      - name: Check documentation governance
        run: npm run docs:check

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify built site output
        run: npm run verify:site
