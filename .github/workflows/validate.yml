name: Validate Knowledge Radar

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, validate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build relation index
        run: npm run relations:build

      - name: Run unit tests
        run: npm test

      - name: Validate Knowledge Cards
        run: npm run validate

      - name: Validate relation index
        run: npm run relations:validate

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify built site output
        run: npm run verify:site
