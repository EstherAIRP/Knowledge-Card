name: Update Relation Index

on:
  push:
    branches:
      - main
    paths:
      - "content/knowledge/**"
      - "config/relation-overrides.yaml"
      - "config/relation-config.yaml"
      - "scripts/build-embeddings.mjs"
      - "scripts/validate-embeddings.mjs"
      - "scripts/build-relations.mjs"
      - "scripts/validate-relations.mjs"
      - "scripts/lib/relations.mjs"
      - "scripts/lib/semantic-relations.mjs"
      - "scripts/lib/model-clients.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relation-index-main
  cancel-in-progress: true

jobs:
  update:
    name: Refresh semantic relation indexes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRANSFORMERS_CACHE_DIR: .cache/transformers
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: transformers-${{ runner.os }}-${{ hashFiles('config/relation-config.yaml', 'package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build embedding index
        run: npm run embeddings:build

      - name: Validate embedding index
        run: npm run embeddings:validate

      - name: Build semantic relation index
        run: npm run relations:build:semantic

      - name: Report relation diagnostics
        run: npm run relations:report

      - name: Validate relation index
        run: npm run relations:validate

      - name: Run unit tests
        run: npm test

      - name: Commit generated indexes
        shell: bash
        run: |
          if git diff --quiet -- data/embeddings.json data/relations.json; then
            echo "Semantic relation indexes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/embeddings.json data/relations.json
          git commit -m "chore: refresh semantic relation indexes"
          git push
