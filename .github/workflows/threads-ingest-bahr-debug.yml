name: Threads Ingest BAhr Debug

on:
  push:
    branches:
      - dev/ingest-threads-bahr4lfbi8
    paths:
      - '.github/workflows/threads-ingest-bahr-debug.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify accepted mandatory preflight
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { prepareExternalIngestion } from './scripts/lib/source-ingestion.mjs';

          const rawUrl = 'https://www.threads.com/share/BAhr4lFBi8/';
          const expected = ['Db_FPlxAdrv', 'Db_FP9yAVmP', 'Db_FQWrAZuU', 'Db_FQ4-AdFk'];
          const result = await prepareExternalIngestion(rawUrl, path.resolve('content/knowledge'), {
            continuationRanker: async ({ rootPost, candidates }) => {
              assert.equal(rootPost.shortcode, 'Db_FPHwgfOS');
              assert.equal(rootPost.username, 'aiposthub');
              assert.match(rootPost.text || '', /DeepSeek Harness/i);
              const actual = candidates.map((candidate) => candidate.shortcode);
              assert.deepEqual(actual, expected);
              return {
                selected_shortcodes: expected,
                root_only: false,
                confidence: 0.99,
                complete: true,
                rationale: 'All four immediate same-author replies continue the same DeepSeek Harness article, covering capabilities, architecture, usage, maturity and conclusion.',
                candidate_labels: candidates.map((candidate) => ({
                  shortcode: candidate.shortcode,
                  label: 'continuation',
                  confidence: 0.99
                }))
              };
            }
          });
          assert.equal(result.source_document.thread.status, 'INFERRED_THREAD_HIGH_CONFIDENCE');
          assert.equal(result.source_document.thread.verification, 'llm_assisted');
          assert.equal(result.source_document.thread.total, 5);
          assert.deepEqual(result.source_document.parts.map((part) => part.shortcode), ['Db_FPHwgfOS', ...expected]);
          console.log('RESULT');
          console.log(JSON.stringify(result, null, 2));
          NODE
