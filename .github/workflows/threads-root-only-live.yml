name: Threads Root-Only Live Acceptance

on:
  push:
    branches:
      - dev/threads-root-only-inference
    paths:
      - '.github/workflows/threads-root-only-live.yml'
      - 'scripts/lib/sources/threads/**'
      - 'scripts/lib/source-extraction.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify VoxCPM root-only recovery
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { extractExternalSource } from './scripts/lib/source-extraction.mjs';

          const rawUrl = 'https://www.threads.com/share/BATF5u8Dv0/';
          const expectedCandidates = ['DZOJXoUk04Y', 'DZOe_OXD3QV'];

          const result = await extractExternalSource(rawUrl, {
            requireComplete: true,
            continuationRanker: async ({ rootPost, candidates }) => {
              assert.equal(rootPost.shortcode, 'DZM-GSYlLXj');
              assert.equal(rootPost.username, 'junyan5400');
              assert.match(rootPost.text || '', /VoxCPM/i);

              const actual = candidates.map((candidate) => candidate.shortcode);
              assert.deepEqual(actual, expectedCandidates);
              assert.match(candidates[0].text || '', /VibeVoice/i);

              return {
                selected_shortcodes: [],
                root_only: true,
                confidence: 0.97,
                complete: true,
                rationale: 'The root is the complete VoxCPM article; both captured same-author replies are later follow-up discussion.',
                candidate_labels: candidates.map((candidate) => ({
                  shortcode: candidate.shortcode,
                  label: 'followup',
                  confidence: 0.96
                }))
              };
            }
          });

          const source = result.source;
          assert.equal(result.resolution.canonical_url, 'https://threads.com/@junyan5400/post/DZM-GSYlLXj');
          assert.equal(source.source_identity, 'threads:DZM-GSYlLXj');
          assert.equal(source.thread.status, 'INFERRED_SINGLE_POST_HIGH_CONFIDENCE');
          assert.equal(source.thread.verification, 'llm_assisted');
          assert.equal(source.thread.recovery.root_only, true);
          assert.equal(source.thread.total, 1);
          assert.deepEqual(source.parts.map((part) => part.shortcode), ['DZM-GSYlLXj']);
          assert.match(source.combined_text, /VoxCPM/i);
          assert.doesNotMatch(source.combined_text, /VibeVoice/i);
          assert.equal(source.extraction.method, 'llm_assisted_root_only');
          assert.equal(source.extraction.conversation_complete, true);

          console.log(JSON.stringify({
            canonical_url: source.canonical_url,
            source_identity: source.source_identity,
            thread_status: source.thread.status,
            verification: source.thread.verification,
            total: source.thread.total,
            candidates: expectedCandidates
          }, null, 2));
          NODE
